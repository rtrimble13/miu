[project]
name = "miu"
version = "0.1.0"
description = "Market Index Utility — build bespoke, survivorship-bias-free equity indices from the FMP API."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "miu contributors" }]
keywords = ["finance", "index", "equity", "fmp", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.6",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    "tenacity>=8.3",
    "rich>=13.7",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
miu = "miu.cli:app"

[project.urls]
Homepage = "https://github.com/rtrimble13/miu"
Issues = "https://github.com/rtrimble13/miu/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miu"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: regression tests that build full indices over multi-year windows",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:dateutil.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Typer requires `typer.Option(...)` as parameter defaults — that pattern is its
# entire DSL, so B008 is a false positive here.
"miu/cli.py" = ["B008"]

[tool.coverage.run]
branch = true
source = ["miu"]

[tool.coverage.report]
show_missing = true
skip_covered = true
